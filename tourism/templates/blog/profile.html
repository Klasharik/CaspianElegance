{% extends 'base.html' %}
{% load static %}

{% block title %}My Profile{% endblock %}

{% block css_files %}
<link rel="stylesheet" href="{% static 'blog/css/profile.css' %}">
{% endblock %}

{% block content %}
<section class="registration-bg" style="background-image: url('{% static "blog/images/sing in/line.png" %}');">
  <div class="overlay profile-form">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="card shadow rounded-4">
            <div class="card-body p-4 text-center">
              
              <i class="bi bi-person-circle" style="font-size: 4rem; color: #020b5a;"></i>

              <h2 class="card-title registration-label mb-3 mt-3">
                {{ user.first_name }} {{ user.last_name }}
              </h2>

              <p class="text-muted mb-4">{{ user.email }}</p>

              <a href="{% url 'favourites' %}" class="btn btn-outline-dark rounded-pill mb-2 btn-favourites">
                My Favourites
              </a>

              <a href="{% url 'account_logout' %}" class="btn-sign-out">
                Sign Out
              </a>

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
